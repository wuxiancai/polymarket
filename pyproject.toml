[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyarb"
version = "1.0.8"
description = "Polymarket BTC/ETH/XRP/SOL daily-plus arbitrage paper trading scanner"
requires-python = ">=3.9"
dependencies = ["websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ws = ["websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
