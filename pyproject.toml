[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyarb"
version = "2.5.1"
description = "Polymarket BTC/ETH/XRP/SOL live and paper trading dashboard"
requires-python = ">=3.11"
dependencies = ["polymarket-client>=0.3,<0.4", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ws = ["websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
